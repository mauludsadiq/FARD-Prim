name: FARD Prim Regression Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    name: Regression (Linux ARM64)
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install fardrun
        run: |
          sudo cp ci/fardrun-linux-arm64 /usr/local/bin/fardrun
          sudo chmod +x /usr/local/bin/fardrun
          fardrun --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create output directory
        run: mkdir -p out

      - name: Run FARD regression suite (ARM64)
        run: |
          fardrun run --program programs/regression_arm64.fard --out /tmp/reg
          chmod +x out/r_* 2>/dev/null || true
          python3 programs/regression_run.py /tmp/reg/result.json

      - name: Debug binaries
        run: |
          python3 programs/compile_python.py 'def fact(n):\n  if n == 0:\n    return 1\n  return n * fact(n - 1)\nfact(5)' out/debug_fact || true
          objdump -d out/debug_fact > out/debug_fact.asm 2>&1 || true
          python3 programs/compile_python.py 'def f():\n  xs = []\n  xs.append(1)\n  return len(xs)\nf()' out/debug_list || true
          objdump -d out/debug_list > out/debug_list.asm 2>&1 || true

      - name: Run Python regression suite
        run: python3 programs/regression_python.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-output
          path: out/
