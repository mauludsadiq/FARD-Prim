name: FARD Prim Regression Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    name: Regression (Linux ARM64)
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install fardrun
        run: |
          sudo cp ci/fardrun-linux-arm64 /usr/local/bin/fardrun
          sudo chmod +x /usr/local/bin/fardrun
          fardrun --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create output directory
        run: mkdir -p out

      - name: Run FARD regression suite (ARM64)
        run: |
          fardrun run --program programs/regression_arm64.fard --out /tmp/reg
          chmod +x out/r_* 2>/dev/null || true
          python3 programs/regression_run.py /tmp/reg/result.json

      - name: Run Python regression suite
        run: python3 programs/regression_python.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-output
          path: out/

  regression-x86:
    name: Regression (Linux x86-64)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install fardrun
        run: |
          sudo cp ci/fardrun-linux-x86_64 /usr/local/bin/fardrun
          sudo chmod +x /usr/local/bin/fardrun
          fardrun --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create output directory
        run: mkdir -p out

      - name: Run FARD regression suite (x86-64 ELF)
        run: |
          fardrun run --program programs/regression_elf.fard --out /tmp/reg_elf
          chmod +x out/r_* 2>/dev/null || true
          python3 programs/regression_run.py /tmp/reg_elf/result.json

      - name: Run IR golden tests
        run: python3 programs/ir_golden_run.py

      - name: Run optimizer differential tests
        run: python3 programs/regression_opt_differential.py

      - name: Debug int_to_str on Linux
        run: |
          python3 programs/compile_python.py 's=str(42)' out/t_its_debug
          python3 -c "
import struct
d=open('out/t_its_debug','rb').read()
# int_to_str at text_offset 495, call at offset 115, rel32 at 496+115=611
it_call = 4096+495+115
rel=struct.unpack('<i',d[it_call+1:it_call+5])[0]
next_ip=it_call+5
alloc=4096+669
print('it_rel32:', rel, 'should_be:', alloc-next_ip, 'next_ip:', next_ip, 'alloc:', alloc)
it_bytes=list(d[4096+495:4096+500])
print('it_start_bytes:', it_bytes)
"
      - name: Run Python regression suite (x86-64)
        run: python3 programs/regression_python.py

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-output-x86
          path: out/
