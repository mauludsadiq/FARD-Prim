name: FARD Prim Regression Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    name: Regression (Linux ARM64)
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install fardrun
        run: |
          sudo cp ci/fardrun-linux-arm64 /usr/local/bin/fardrun
          sudo chmod +x /usr/local/bin/fardrun
          fardrun --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create output directory
        run: mkdir -p out

      - name: Run FARD regression suite (ARM64)
        run: |
          fardrun run --program programs/regression_arm64.fard --out /tmp/reg
          chmod +x out/r_* 2>/dev/null || true
          python3 programs/regression_run.py /tmp/reg/result.json

      - name: Run Python regression suite
        run: python3 programs/regression_python.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-output
          path: out/

  regression-x86:
    name: Regression (Linux x86-64)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install fardrun
        run: |
          sudo cp ci/fardrun-linux-x86_64 /usr/local/bin/fardrun
          sudo chmod +x /usr/local/bin/fardrun
          fardrun --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create output directory
        run: mkdir -p out

      - name: Run FARD regression suite (x86-64 ELF)
        run: |
          fardrun run --program programs/regression_elf.fard --out /tmp/reg_elf
          chmod +x out/r_* 2>/dev/null || true
          python3 programs/regression_run.py /tmp/reg_elf/result.json

      - name: Run IR golden tests
        run: python3 programs/ir_golden_run.py

      - name: Run optimizer differential tests
        run: python3 programs/regression_opt_differential.py

      - name: Debug ELF str stubs
        run: |
          python3 programs/compile_python.py 'a="hi"
b="!"
c=a+b
len(c)' out/t_debug_str || true
          python3 -c "
import struct
with open('out/t_debug_str','rb') as f: d=f.read()
text=4096
# Find str_concat stub (starts at entry+print = 85+285=370)
sc_start = text+370
print('str_concat bytes 36-43:',list(d[sc_start+36:sc_start+44]))
print('Expected call: [232,...]')
print('rel32:',struct.unpack("<i",d[sc_start+38:sc_start+42])[0])
# Find alloc stub
alloc_start = text+370+299
print('alloc bytes:',list(d[alloc_start:alloc_start+7]))
print('Expected: [72,137,216,72,1,251,195]')
" || true
      - name: Run Python regression suite (x86-64)
        run: python3 programs/regression_python.py

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-output-x86
          path: out/
