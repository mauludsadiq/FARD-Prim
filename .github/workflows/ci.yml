name: FARD Prim Regression Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    name: Regression (Linux ARM64)
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install fardrun
        run: |
          sudo cp ci/fardrun-linux-arm64 /usr/local/bin/fardrun
          sudo chmod +x /usr/local/bin/fardrun
          fardrun --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create output directory
        run: mkdir -p out

      - name: Run FARD regression suite (ARM64)
        run: |
          fardrun run --program programs/regression_arm64.fard --out /tmp/reg
          chmod +x out/r_* 2>/dev/null || true
          python3 programs/regression_run.py /tmp/reg/result.json

      - name: Debug while loop
        run: |
          python3 programs/compile_python.py 'def f():\n  i = 0\n  while i < 3:\n    i = i + 1\n  return i\nf()' out/debug_while || true
          objdump -d out/debug_while 2>/dev/null || true

      - name: Run Python regression suite
        run: python3 programs/regression_python.py

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-output
          path: out/
