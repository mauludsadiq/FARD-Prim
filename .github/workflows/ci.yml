name: FARD Prim Regression Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    name: Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]

    steps:
      - uses: actions/checkout@v4

      - name: Install fardrun
        run: |
          curl -L https://github.com/mauludsadiq/FARD/releases/download/v1.6.1/fardrun-linux-x86_64 \
            -o /usr/local/bin/fardrun
          chmod +x /usr/local/bin/fardrun
          fardrun --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node.js (for Acorn JS parser)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create output directory
        run: mkdir -p out

      - name: Run FARD regression suite
        run: |
          fardrun run --program programs/regression.fard --out /tmp/reg
          chmod +x out/r_* 2>/dev/null || true
          python3 programs/regression_run.py /tmp/reg/result.json

      - name: Run Python regression suite
        run: python3 programs/regression_python.py

      - name: Upload regression artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-output
          path: |
            /tmp/reg/
            out/
